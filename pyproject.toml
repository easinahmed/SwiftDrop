[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "swiftdrop"
dynamic = ["version"]
description = "A fast, reliable media downloader for macOS."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pywebview==6.2.1",
    "yt-dlp[default]==2026.8.19",
    "requests==2.34.2",
    "certifi>=2026.7.22",
    "pyobjc-framework-Cocoa==12.2.2",
    "pyobjc-framework-WebKit==12.2.2",
    "pyobjc-framework-UserNotifications==12.2.2",
    "pyobjc-framework-ServiceManagement==12.2.2",
]

[project.scripts]
swiftdrop = "swiftdrop.app:main"

[tool.setuptools.dynamic]
version = { attr = "swiftdrop.appinfo.APP_VERSION" }

[tool.setuptools.packages.find]
include = ["swiftdrop*"]

[tool.setuptools.package-data]
swiftdrop = ["ui/web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: tests that reach the public internet (skipped unless SWIFTDROP_NETWORK_TESTS=1)",
    "ffmpeg: tests that need an ffmpeg binary",
]
filterwarnings = ["ignore::DeprecationWarning:yt_dlp.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend", "build", "dist", "vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "S603",   # subprocess without shell, arguments are never user-controlled shell strings
    "S607",   # fixed system tools (open, osascript, iconutil) resolved from PATH
    "RUF012",
    "RUF001", "RUF002", "RUF003",  # typographic quotes/dashes are intentional in user-facing text
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"packaging/*" = ["S"]
"scripts/*" = ["S"]

[tool.mypy]
python_version = "3.14"
packages = ["swiftdrop"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
ignore_missing_imports = true
